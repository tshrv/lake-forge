version: 2

models:
  - name: int_order_sales
    description: |
      One row per order line enriched with order-level information
      and reusable sales metrics

    columns:

      - name: order_key
        tests:
          - not_null

      - name: customer_key
        tests:
          - not_null

      - name: net_sales
        tests:
          - not_null

    tests:
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          expression: "sum(net_sales)"
          compare_model: ref('customer_revenue')
          compare_expression: "sum(revenue)"
      # This verifies a key business invariant:
      # SUM(int_order_sales.net_sales) == SUM(customer_revenue.revenue)
      # If those totals ever diverge because of an incorrect join or aggregation, the test will fail. That's the kind of end-to-end consistency check that's very valuable in production.